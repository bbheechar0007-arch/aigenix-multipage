<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI.Genix-India | Contact Us</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
<h2>AI.Genix-India</h2>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="about.html">About Us</a></li>
<li><a href="contact.html">Contact Us</a></li>
</ul>
</nav>

<section class="form-container">
<h1>Contact Us / Request Project</h1>

<form id="contactForm">
<div class="form-group">
<label for="name">Full Name</label>
<input type="text" id="name" required placeholder="Enter your name">
</div>

<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" required placeholder="Enter your email">
</div>

<div class="form-group">
<label for="phone">Phone / WhatsApp Number</label>
<input type="tel" id="phone" required placeholder="Enter your phone number">
</div>

<div class="form-group">
<label for="message">Project Details</label>
<textarea id="message" rows="5" required placeholder="Describe your project..."></textarea>
</div>

<button type="submit" id="submitBtn">Send Inquiry</button>
</form>

<p id="responseMsg" style="margin-top:15px;"></p>
</section>

<script type="module" src="contact.js"></script>
</body>
</html>
